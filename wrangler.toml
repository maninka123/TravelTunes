name = "traveltunes"
compatibility_date = "2026-06-28"
pages_build_output_dir = "dist"

# Optional: To enable persistent KV caching across serverless instances:
# 1. Run `npx wrangler kv namespace create YT_CACHE`
# 2. Uncomment the block below and replace the id with your generated 32-character hex ID:
# [[kv_namespaces]]
# binding = "YT_CACHE"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional: run log and usage counters
# 1. Run `npx wrangler d1 create traveltunes-runs`
# 2. Uncomment below and paste the returned database_id
# 3. Apply migrations with `npx wrangler d1 migrations apply traveltunes-runs`
# [[d1_databases]]
# binding = "RUN_LOG"
# database_name = "traveltunes-runs"
# database_id = "REPLACE_WITH_DATABASE_ID"
